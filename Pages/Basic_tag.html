<!DOCTYPE html>  <!-- create structure of html document/Main for Html Webpage -->
<html lang="en">
<head> <!-- All the meta data of the webpage is written in head tag. It is not visible to the user. It is used for SEO purpose. css and js files are linked in head tag. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <!-- Title tag is used to give title to the webpage. It is visible to the user in the browser tab. It is also used for SEO purpose. -->
</head><!-- head tag is closed here. -->
<body> <!--All Tag and Attribute are written in body tag. It is visible to the user. It is used to display content on the webpage. -->
    <h1>Heading 1</h1> <!-- h1 tag is used to create heading of the webpage. It is used for SEO purpose. -->
    <h2>Heading 2</h2> <!-- h2 tag is used to create heading of the webpage. It is used for SEO purpose. -->
    <h3>Heading 3</h3> <!-- h3 tag is used to create heading of the webpage. It is used for SEO purpose. -->
    <h4>Heading 4</h4> <!-- h4 tag is used to create heading of the webpage. It is used for SEO purpose. -->
    <h5>Heading 5</h5> <!-- h5 tag is used to create heading of the webpage. It is used for SEO purpose. -->
    <h6>Heading 6</h6> <!-- h6 tag is used to create heading of the webpage. It is used for SEO purpose. --> 
        <!-- h1 to h6 tag is used to create heading of the webpage. It is used for SEO purpose. h1>h2>h3>h4>h5>h6 -->
    <p>This is a paragraph.</p> <!-- p tag is used to create paragraph of the webpage. It is used for SEO purpose. -->
    
</body> <!-- body tag is closed here. -->
</html> <!-- html tag is closed here. -->
