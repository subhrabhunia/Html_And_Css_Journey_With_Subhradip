<!DOCTYPE html>  <!-- create structure of html document/Main for Html Webpage -->
<html lang="en">
<head> <!-- All the meta data of the webpage is written in head tag. It is not visible to the user. It is used for SEO purpose. css and js files are linked in head tag. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <!-- Title tag is used to give title to the webpage. It is visible to the user in the browser tab. It is also used for SEO purpose. -->
</head><!-- head tag is closed here. -->
<body> <!--All Tag and Attribute are written in body tag. It is visible to the user. It is used to display content on the webpage. -->
    Hello World! <!-- This is a comment. It is not visible to the user. It is used to explain the code. -->
</body> <!-- body tag is closed here. -->
</html> <!-- html tag is closed here. -->
