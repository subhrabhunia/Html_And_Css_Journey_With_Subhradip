<!-- In this file we know about Marquee tag Use for Animation in screen. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Tag</title>
</head>
<body>
    <marquee>THIS IS MARQUEE TAG</marquee> <!--Use to Animation in Screen-->

    <marquee behavior="scroll">THIS IS MARQUEE TAG </marquee> <!-- behavior="scroll" makes the text continuously scroll.This is default Animation. -->
    <marquee behavior="slide">THIS IS MARQUEE TAG</marquee> <!-- behavior="slide" makes the text scroll in and stop at the end -->
    <marquee behavior="Alternate">THIS IS MARQUEE TAG</marquee> <!-- alternate: moves the text back and forth -->

    <marquee scrollamount="10">THIS IS MARQUEE TAG</marquee> <!-- scrollamount: controls the scrolling speed -->

    <marquee direction="right">THIS IS MARQUEE TAG</marquee> <!-- direction: sets the direction of movement -->
    <marquee direction="left">THIS IS MARQUEE TAG</marquee> <!-- direction="left": moves the text towards the left.This is default value -->
    <marquee direction="up">THIS IS MARQUEE TAG</marquee> <!-- direction="up": moves the text from bottom to top -->
    <marquee direction="down">THIS IS MARQUEE TAG</marquee> <!-- direction="down": moves the text from top to bottom -->

    <marquee scrolldelay="5">THIS IS MARQUEE TAG</marquee> <!-- scrolldelay: controls the delay between each movement -->

    <marquee loop="4">THIS IS MARQUEE TAG</marquee> <!-- loop: sets how many times the text will scroll -->

    <marquee bgcolor="Red">THIS IS MARQUEE TAG</marquee> <!-- bgcolor: sets the background color of the marquee -->

    <marquee width="20%", height="20%">THIS IS MARQUEE TAG</marquee>  <!-- width: sets the width of the marquee. Sets the marquee width to 20% of its parent/container. -->   <!-- height: sets the height of the marquee.Sets the marquee height to 20% of its parent/container. -->
</body>
</html>
