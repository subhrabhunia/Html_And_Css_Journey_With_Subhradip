<!-- In this file know about table tag -->
<!-- Table tag use to store data in table format in website -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Tag</title>
  </head>
  <body>
    <!-- Table Start -->
    <!-- border = Adds border to table -->
    <!-- width = Sets table width -->
    <!-- cellpadding = Space inside cell -->
    <!-- cellspacing = Space between cells -->
    <!-- bgcolor = Background color -->
    <!-- align = Horizontal alignment -->
    <!-- valign = Vertical alignment -->
    <table
      border="1"
      width="300px"
      cellpadding="10px"
      cellspacing="10px"
      bgcolor="pink"
      align="center"
    >
      <!-- Table Row -->
      <tr>
        <!-- Table Heading -->
        <th>Name</th>

        <!-- Table Heading -->
        <th>Class</th>

        <!-- Table Heading -->
        <th>Gender</th>

        <!-- Table Heading -->
        <th>Percentage</th>
      </tr>

      <!-- Row 1 -->
      <tr bgcolor="white">
        <!-- Table Data -->
        <td valign="top">John</td>

        <!-- Cell Background Color -->
        <td bgcolor="blue">12th</td>

        <!-- Table Data -->
        <td>Male</td>

        <!-- Table Data -->
        <td>80%</td>
      </tr>

      <!-- Row 2 -->
      <tr align="left">
        <!-- Vertical Align Bottom -->
        <td valign="bottom">Emma</td>

        <!-- Horizontal Align Right -->
        <td align="right">11th</td>

        <!-- Table Data -->
        <td>Female</td>

        <!-- Table Data -->
        <td>85%</td>
      </tr>

      <!-- Row 3 -->
      <tr>
        <!-- Vertical Align Middle -->
        <td valign="middle">David</td>

        <!-- Cell Height -->
        <td height="30px">10th</td>

        <!-- Table Data -->
        <td>Male</td>

        <!-- Table Data -->
        <td>78%</td>
      </tr>

      <!-- Row 4 -->
      <tr>
        <!-- Table Data -->
        <td>Sophia</td>

        <!-- Table Data -->
        <td>12th</td>

        <!-- Table Data -->
        <td>Female</td>

        <!-- Table Data -->
        <td>92%</td>
      </tr>
    </table>
    <!-- Table End -->
  </body>
</html>
