<!-- This file demonstrates the Audio Tag in HTML -->
<!-- The audio tag is used to add audio files to a web page -->

<!-- Supported Audio Formats:
     1. MP3
     2. OGG
     3. WAV
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Tag</title>
  </head>
  <body>
    <!-- Audio Player -->
     
    <!-- controls: Displays audio controls such as Play, Pause, and Volume -->

    <!-- autoplay: Automatically starts playing the audio when the page loads -->

    <!-- loop: Repeats the audio continuously after it ends -->

    <!-- muted: Starts the audio in muted mode -->
    <audio controls autoplay loop muted>
      <!-- Audio Source File -->
      <source src="../Assest/Audio/Audio_1.mp3" type="audio/mpeg" />

      <!-- Message displayed if the browser does not support audio -->
      Your browser does not support the audio element.
    </audio>
  </body>
</html>
