<!--In this file we know about Performated tag and Horizontal tag in html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performated AND Horizontal tag</title>
</head>
<body>
    <pre> <!-- pre: preserves spaces and line breaks exactly as written under the tag. -->
    Hello    World
    Hello 
    World
    </pre>
    
    <hr> <!-- hr: creates a horizontal line/divider -->

    <h1>This is Example of Horizontal Tag</h1>
    <hr> <!-- hr: creates a horizontal line/divider -->
    <h1>This is Example of Horizontal Tag</h1>

</body>
</html>
