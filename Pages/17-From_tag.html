<!-- In this file we learn about the Form Tag -->
<!-- Form tag is used to collect user information such as name, password, gender, hobbies, messages, city selection, and datalist. -->

<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Makes the webpage responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title shown on browser tab -->
    <title>Form Tag Part 1</title>
  </head>
  <body>
    <!--
        <form> Tag

        action=""
        -> Specifies where form data will be sent.

        method="get"
        -> Sends form data through the URL.

        method="post"
        -> Sends form data in the request body.
    -->
    <form action="" method="post">
      <!-- First Name -->
      <label for="firstname">First Name</label>

      <input
        type="text"
        name="firstname"
        id="firstname"
        placeholder="Enter Your First Name"
      />

      <br /><br />

      <!-- Password -->
      <label for="password">Password</label>

      <input
        type="password"
        name="password"
        id="password"
        placeholder="Enter Your Password"
      />

      <br /><br />

      <!-- Gender -->
      <label>Gender</label>

      <br />

      <input type="radio" name="gender" value="Male" id="male" />
      <label for="male">Male</label>

      <input type="radio" name="gender" value="Female" id="female" />
      <label for="female">Female</label>

      <br /><br />

      <!-- Hobbies -->
      <label>Hobbies</label>

      <br />

      <input type="checkbox" name="hobbies" value="Reading" id="reading" />
      <label for="reading">Reading</label>

      <br />

      <input type="checkbox" name="hobbies" value="Music" id="music" />
      <label for="music">Music</label>

      <br />

      <input type="checkbox" name="hobbies" value="Sports" id="sports" />
      <label for="sports">Sports</label>

      <br /><br />

      <!-- Message Field -->
      <label for="message">Message</label>

      <br />

      <textarea
        id="message"
        name="message"
        rows="5"
        cols="30"
        placeholder="Write your message here..."
      ></textarea>

      <br /><br />

      <!-- City Selection -->
      <label for="city">Select Your City</label>

      <br />

      <!--
            <select> Tag
            -> Creates a dropdown list.

            <option> Tag
            -> Creates options inside the dropdown.

            <optgroup> Tag
            -> Groups related options together.
        -->
      <select name="city" id="city">
        <option value="" selected>--Select City--</option>

        <optgroup label="East India">
          <option value="Kolkata">Kolkata</option>
          <option value="Bhubaneswar">Bhubaneswar</option>
          <option value="Patna">Patna</option>
        </optgroup>

        <optgroup label="North India">
          <option value="Delhi">Delhi</option>
          <option value="Lucknow">Lucknow</option>
          <option value="Chandigarh">Chandigarh</option>
        </optgroup>

        <optgroup label="South India">
          <option value="Chennai">Chennai</option>
          <option value="Bangalore">Bangalore</option>
          <option value="Hyderabad">Hyderabad</option>
        </optgroup>
      </select>

      <br /><br />

      <!--
            <datalist> Tag
            -> Provides predefined suggestions for an input field.

            list
            -> Connects input with datalist.

            <option>
            -> Defines suggested values.

            Users can select a suggestion
            or type their own value.
        -->
      <label for="course">Select Course</label>

      <br />

      <input
        type="text"
        name="course"
        id="course"
        list="courses"
        placeholder="Choose or Type a Course"
      />

      <!-- Datalist -->
      <datalist id="courses">
        <option value="BCA"></option>
        <option value="B.Tech"></option>
        <option value="B.Sc"></option>
        <option value="B.Com"></option>
        <option value="MCA"></option>
        <option value="MBA"></option>
      </datalist>

      <br /><br />
      <!--
    File Upload Section

    <input type="file">
    -> Allows users to upload files.

    accept
    -> Specifies allowed file types.

    multiple
    -> Allows multiple file selection.
-->
      <label for="resume">Upload Resume</label>

      <br />

      <input type="file" name="resume" id="resume" accept=".pdf,.doc,.docx" />

      <br />
      <br />

      <!--
            type="submit"
            -> Creates a submit button.
        -->
      <input type="submit" value="Submit" />

      <!--
            type="reset"
            -> Clears all form fields.
        -->
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
