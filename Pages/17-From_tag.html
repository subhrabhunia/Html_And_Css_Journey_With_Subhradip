<!-- In this file we learn about the Form Tag -->
<!-- Form tag is used to collect user information such as name, password, gender, hobbies, messages, city selection, and file upload. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title shown on browser tab -->
    <title>Form Tag Part 1</title>
</head>
<body>

    <!--
        <form> Tag

        action=""
        -> Specifies where form data will be sent.

        method="get"
        -> Sends form data through the URL.

        method="post"
        -> Sends form data in the request body.
    -->
    <form action="" method="post">

        <!--
            <fieldset> Tag

            -> Groups related form elements together.
            -> Creates a border around the grouped elements.

            <legend> Tag

            -> Defines a title/caption for the fieldset.
        -->
        <fieldset>

            <legend>User Registration Form</legend>

            <!-- First Name -->
            <label for="firstname">First Name</label>

            <!--
                type="text"
                -> Creates a text input box.

                placeholder
                -> Displays a hint inside the input field.
            -->
            <input
                type="text"
                name="firstname"
                id="firstname"
                placeholder="Enter Your First Name"
            >

            <br><br>

            <!-- Password -->
            <label for="password">Password</label>

            <!--
                type="password"
                -> Hides entered characters.
            -->
            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter Your Password"
            >

            <br><br>

            <!-- Gender -->
            <label>Gender</label>

            <br>

            <!--
                type="radio"
                -> Allows only one option to be selected.
            -->
            <input type="radio" name="gender" value="Male" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" value="Female" id="female">
            <label for="female">Female</label>

            <br><br>

            <!-- Hobbies -->
            <label>Hobbies</label>

            <br>

            <!--
                type="checkbox"
                -> Allows multiple options to be selected.
            -->
            <input type="checkbox" name="hobbies" value="Reading" id="reading">
            <label for="reading">Reading</label>

            <br>

            <input type="checkbox" name="hobbies" value="Music" id="music">
            <label for="music">Music</label>

            <br>

            <input type="checkbox" name="hobbies" value="Sports" id="sports">
            <label for="sports">Sports</label>

            <br><br>

            <!-- Message -->
            <label for="message">Message</label>

            <br>

            <!--
                <textarea> Tag

                -> Creates a multi-line text input area.

                rows
                -> Number of visible rows.

                cols
                -> Number of visible columns.
            -->
            <textarea
                id="message"
                name="message"
                rows="5"
                cols="30"
                placeholder="Write your message here..."
            ></textarea>

            <br><br>

            <!-- City Selection -->
            <label for="city">Select Your City</label>

            <br>

            <!--
                <select> Tag
                -> Creates a dropdown list.

                <option> Tag
                -> Creates options inside the dropdown.

                <optgroup> Tag
                -> Groups related options together.
            -->
            <select name="city" id="city">

                <option value="" selected>
                    --Select City--
                </option>

                <optgroup label="East India">
                    <option value="Kolkata">Kolkata</option>
                    <option value="Bhubaneswar">Bhubaneswar</option>
                    <option value="Patna">Patna</option>
                </optgroup>

                <optgroup label="North India">
                    <option value="Delhi">Delhi</option>
                    <option value="Lucknow">Lucknow</option>
                    <option value="Chandigarh">Chandigarh</option>
                </optgroup>

                <optgroup label="South India">
                    <option value="Chennai">Chennai</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Hyderabad">Hyderabad</option>
                </optgroup>

            </select>

            <br><br>

            <!-- Course Selection Using Datalist -->
            <label for="course">Select Course</label>

            <br>

            <!--
                <datalist> Tag

                -> Provides predefined suggestions.

                list
                -> Connects input with datalist.
            -->
            <input
                type="text"
                name="course"
                id="course"
                list="courses"
                placeholder="Choose or Type a Course"
            >

            <datalist id="courses">
                <option value="BCA">
                <option value="B.Tech">
                <option value="B.Sc">
                <option value="B.Com">
                <option value="MCA">
                <option value="MBA">
            </datalist>

            <br><br>

            <!-- File Upload -->
            <label for="resume">Upload Resume</label>

            <br>

            <!--
                type="file"
                -> Allows users to upload files.

                accept
                -> Restricts allowed file types.
            -->
            <input
                type="file"
                name="resume"
                id="resume"
                accept=".pdf,.doc,.docx"
            >

            <br><br>

            <!-- Buttons -->

            <!--
                type="submit"
                -> Submits the form.
            -->
            <input type="submit" value="Submit">

            <!--
                type="reset"
                -> Resets all form fields.
            -->
            <input type="reset" value="Reset">

            <!--
                type="button"
                -> Creates a normal button.
            -->
            <button type="button">Click Me</button>

            <br><br>

            <!-- Image Button -->

            <!--
                type="image"

                -> Displays an image as a submit button.

                src
                -> Specifies image path.

                alt
                -> Alternative text.

                width
                -> Sets image width.

                height
                -> Sets image height.
            -->
            <input
                type="image"
                src="../Assest/Images/Image1.JPG"
                alt="Submit"
                width="120"
                height="50"
            >

        </fieldset>

    </form>

</body>
</html>
