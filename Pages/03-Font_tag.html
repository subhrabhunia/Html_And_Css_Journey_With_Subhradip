<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Tag</title>
</head>
<body>
    <h1><font color="Red">SUBHRADIP</font></h1> <!-- Use to change the color of the text. It is used for SEO purpose. -->
    
    <p><font size="6">This is a paragraph with a larger font size.</font></p> <!-- Use to change the size of the text. It is used for SEO purpose. The large size is 7 and Small size is 1 -->

    <P><font face="Arial">This is Paragraph use to check font Face</font></P> <!-- Use to change the font face of the text. It is used for SEO purpose. -->
    <P><font face="Verdana">This is Paragraph use to check font Face</font></P> <!-- Use to change the font face of the text. It is used for SEO purpose. -->
    <P><font face="Impact">This is Paragraph use to check font Face</font></P> <!-- Use to change the font face of the text. It is used for SEO purpose. -->
    <!-- If these fonts are not available in the user system then it will show the default font of the user system. It is used for SEO purpose. -->
</body>
</html>
