<!-- In this file we know about @font-face. 
 @font-face is used to add a custom font to a webpage from a font file such as .ttf, .woff, or .woff2.-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS @font-face</title>

    <link rel="stylesheet" href="../Css/27-Font-Face.css">

</head>

<body>

    <h2>@FONT-FACE</h2>

    <div class="One">

        <h1>Custom Font Example</h1>

        <p>
            This text is using a custom font
            with the help of @font-face.
        </p>

    </div>

</body>

</html>
