<!-- In this file we know about float property. -->

<!-- CSS FLOAT PROPERTY:-

1. float: left;
2. float: right;
3. float: none;

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Float</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/11-Float.css">

</head>

<body>

    <!-- Float Left -->

    <div class="One">

        <img src="../Assest/Images/Image1.JPG" alt="Sample Image">

        <p>
            Float Left: The image is moved to the left side
            and the text flows around the image.
        </p>

    </div>

    <br>

    <!-- Float Right -->

    <div class="two">

        <img src="../Assest/Images/Image1.JPG" alt="Sample Image">

        <p>
            Float Right: The image is moved to the right side
            and the text flows around the image.
        </p>

    </div>

    <br>

    <!-- Float None -->

    <div class="three">

        <img src="../Assest/Images/Image1.JPG" alt="Sample Image">

        <p>
            Float None: The image remains in its normal position.
        </p>

    </div>

</body>

</html>
