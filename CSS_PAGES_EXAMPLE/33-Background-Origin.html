<!-- In this file we know about background-origin property. -->

<!-- CSS BACKGROUND-ORIGIN VALUES:-

1. border-box
2. padding-box
3. content-box

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Background Origin</title>

    <link rel="stylesheet" href="../Css/33-Background-Origin.css">

</head>

<body>

    <h1>CSS BACKGROUND-ORIGIN</h1>


    <!-- ==================== BORDER BOX ==================== -->

    <h2>BACKGROUND-ORIGIN: BORDER-BOX</h2>

    <div class="One">

        <p>
            background-origin: border-box;
        </p>

    </div>


    <!-- ==================== PADDING BOX ==================== -->

    <h2>BACKGROUND-ORIGIN: PADDING-BOX</h2>

    <div class="two">

        <p>
            background-origin: padding-box;
        </p>

    </div>


    <!-- ==================== CONTENT BOX ==================== -->

    <h2>BACKGROUND-ORIGIN: CONTENT-BOX</h2>

    <div class="three">

        <p>
            background-origin: content-box;
        </p>

    </div>

</body>

</html>
