<!-- In this file we know about text-orientation property. -->

<!-- CSS TEXT-ORIENTATION VALUES:-

1. mixed
2. upright
3. sideways

NOTE:-

text-orientation is mainly used with
writing-mode: vertical-rl or vertical-lr.

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Text Orientation</title>

    <!-- Link with CSS File -->
    <link rel="stylesheet" href="../Css/21-Text-Orientation.css">

</head>

<body>

    <!-- ==================== TEXT-ORIENTATION ==================== -->

    <h2>TEXT-ORIENTATION</h2>


    <!-- Mixed -->

    <div class="One">

        <p>
            Text Orientation: Mixed
        </p>

    </div>

    <br>


    <!-- Upright -->

    <div class="two">

        <p>
            Text Orientation: Upright
        </p>

    </div>

    <br>


    <!-- Sideways -->

    <div class="three">

        <p>
            Text Orientation: Sideways
        </p>

    </div>

</body>

</html>
