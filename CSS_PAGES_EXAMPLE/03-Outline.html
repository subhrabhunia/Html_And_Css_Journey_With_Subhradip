<!-- In this file we know about outline property. -->

<!-- CSS OUTLINE PROPERTIES:-
1. Outline-Width
2. Outline-Style
   Types: Solid, Dotted, Dashed, Double, Groove,
          Ridge, Inset, Outset, None
3. Outline-Color

CSS OUTLINE SHORTHAND:-
outline: outline-width outline-style outline-color;
-->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Outline</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/03-Outline.css">
</head>
<body>

    <div class="One">
        <p>Outline Style : Solid</p>
    </div>
    <br>

    <div class="two">
        <p>Outline Style : Dotted</p>
    </div>
    <br>

    <div class="three">
        <p>Outline Style : Dashed</p>
    </div>
    <br>

    <div class="four">
        <p>Outline Style : Double</p>
    </div>
    <br>

    <div class="five">
        <p>Outline Style : Groove</p>
    </div>
    <br>

    <div class="six">
        <p>Outline Style : Ridge</p>
    </div>
    <br>

    <div class="seven">
        <p>Outline Style : Inset</p>
    </div>
    <br>

    <div class="eight">
        <p>Outline Style : Outset</p>
    </div>
    <br>

    <div class="nine">

    </div>

    <div class="ten">

</html>
