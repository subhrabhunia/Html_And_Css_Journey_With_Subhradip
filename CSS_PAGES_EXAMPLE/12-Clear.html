<!-- In this file we know about clear property. -->

<!-- CSS CLEAR PROPERTY:-

1. clear: left;
2. clear: right;
3. clear: both;
4. clear: none;

clear is used to control the position of an element relative to floated elements.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Clear</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/12-Clear.css">

</head>

<body>

    <!-- Float Left -->

    <div class="One">

        <img src="../Assest/Images/Image1.JPG" alt="Sample Image">

        <p>Float Left</p>

    </div>

    <br>

    <!-- Clear Left -->

    <div class="two">

        <p>Clear Left</p>

    </div>

    <br>

    <!-- Float Right -->

    <div class="three">

        <img src="../Assest/Images/Image1.JPG" alt="Sample Image">

        <p>Float Right</p>

    </div>

    <br>

    <!-- Clear Right -->

    <div class="four">

        <p>Clear Right</p>

    </div>

    <br>

    <!-- Clear Both -->

    <div class="five">

        <p>Clear Both</p>

    </div>

    <br>

    <!-- Clear None -->

    <div class="six">

        <p>Clear None</p>

    </div>

</body>

</html>
