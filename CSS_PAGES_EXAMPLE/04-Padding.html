<!-- In this file we know about padding property. -->

<!-- CSS PADDING PROPERTIES:-

1. Padding-Top
2. Padding-Right
3. Padding-Bottom
4. Padding-Left

CSS PADDING SHORTHAND:-

padding: all-side;
padding: top-bottom left-right;
padding: top left-right bottom;
padding: top right bottom left;

Padding ব্যবহার করা হয় Content এবং Border-এর মধ্যে ফাঁকা জায়গা (Space) তৈরি করার জন্য।

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Padding</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/04-Padding.css">
</head>
<body>

    <!-- Padding All Sides -->
    <div class="One">
        <p>Padding : 20px</p>
    </div>

    <br>

    <!-- Padding Top Bottom & Left Right -->
    <div class="two">
        <p>Padding : 10px 20px</p>
    </div>

    <br>

    <!-- Padding Top Left-Right Bottom -->
    <div class="three">
        <p>Padding : 10px 20px 30px</p>
    </div>

    <br>

    <!-- Padding Top Right Bottom Left -->
    <div class="four">
        <p>Padding : 10px 20px 30px 40px</p>
    </div>

    <br>

    <!-- Padding Top -->
    <div class="five">
        <p>Padding Top</p>
    </div>

    <br>

    <!-- Padding Right -->
    <div class="six">
        <p>Padding Right</p>
    </div>

    <br>

    <!-- Padding Bottom -->
    <div class="seven">
        <p>Padding Bottom</p>
    </div>

    <br>

    <!-- Padding Left -->
    <div class="eight">
        <p>Padding Left</p>
    </div>

</body>
</html>
