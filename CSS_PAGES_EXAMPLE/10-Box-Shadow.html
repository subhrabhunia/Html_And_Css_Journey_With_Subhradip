<!-- In this file we know about box-shadow property. -->

<!-- CSS BOX-SHADOW SYNTAX:-

box-shadow: horizontal vertical blur spread color;

-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Box Shadow</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/10-Box-Shadow.css" />
  </head>

  <body>
    <!-- Basic Box Shadow -->

    <div class="One">
      <p>Basic Box Shadow</p>
    </div>

    <br />

    <!-- Shadow with Blur -->

    <div class="two">
      <p>Box Shadow with Blur</p>
    </div>

    <br />

    <!-- Shadow with Spread -->

    <div class="three">
      <p>Box Shadow with Spread</p>
    </div>

    <br />

    <!-- Inset Shadow -->

    <div class="four">
      <p>Inset Box Shadow</p>
    </div>

    <br />

    <!-- Multiple Shadow -->

    <div class="five">
      <p>Multiple Box Shadow</p>
    </div>
    <br />

    <!--Minus value-->
    <div class="six">
      <p>Box Shadow : Negative Value</p>
    </div>
  </body>
</html>
