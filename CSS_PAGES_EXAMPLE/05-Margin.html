<!-- In This file we know about margin proprty -->
<!-- Content
   ↓
Padding  → Space between Content and Border
   ↓
Border
   ↓
Margin   → Space outside the Border -->

<!-- CSS MARGIN PROPERTIES:-

1. Margin-Top
2. Margin-Right
3. Margin-Bottom
4. Margin-Left

CSS MARGIN SHORTHAND:-

margin: all-side;
margin: top-bottom left-right;
margin: top left-right bottom;
margin: top right bottom left;

-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Margin</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/05-Margin.css" />
  </head>
  <body>
    <!-- Margin All Sides -->
    <div class="One">
      <p>Margin : 20px</p>
    </div>

    <br />

    <!-- Margin Top-Bottom & Left-Right -->
    <div class="two">
      <p>Margin : 10px 20px</p>
    </div>

    <br />

    <!-- Margin Top Left-Right Bottom -->
    <div class="three">
      <p>Margin : 10px 20px 30px</p>
    </div>

    <br />

    <!-- Margin Top Right Bottom Left -->
    <div class="four">
      <p>Margin : 10px 20px 30px 40px</p>
    </div>

    <br />

    <!-- Margin Top -->
    <div class="five">
      <p>Margin Top</p>
    </div>

    <br />

    <!-- Margin Right -->
    <div class="six">
      <p>Margin Right</p>
    </div>

    <br />

    <!-- Margin Bottom -->
    <div class="seven">
      <p>Margin Bottom</p>
    </div>

    <br />

    <!-- Margin Left -->
    <div class="eight">
      <p>Margin Left</p>
    </div>
    <br/>
    <!-- Margin Auto -->
    <div class="nine">
      <p>Margin Auto</p>
    </div>
  </body>
</html>
