<!-- In this file we know about text-shadow property. -->

<!-- CSS TEXT-SHADOW:-

Syntax:-

text-shadow: horizontal vertical blur color;

VALUES:-

1. Horizontal Shadow
2. Vertical Shadow
3. Blur
4. Color

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Text Shadow</title>

    <!-- Link with CSS File -->
    <link rel="stylesheet" href="../Css/17-Text-Shadow.css">

</head>

<body>

    <!-- ==================== TEXT SHADOW ==================== -->

    <h2>TEXT-SHADOW</h2>

    <!-- Normal Shadow -->

    <div class="One">

        <p>Text Shadow: Normal</p>

    </div>

    <br>

    <!-- Shadow with Blur -->

    <div class="two">

        <p>Text Shadow: Blur</p>

    </div>

    <br>

    <!-- Negative Shadow -->

    <div class="three">

        <p>Text Shadow: Negative Value</p>

    </div>

    <br>

    <!-- Multiple Shadow -->

    <div class="four">

        <p>Text Shadow: Multiple Shadow</p>

    </div>

    <br>

    <!-- No Shadow -->

    <div class="five">

        <p>Text Shadow: None</p>

    </div>

</body>

</html>
