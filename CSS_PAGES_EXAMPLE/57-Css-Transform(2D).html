<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform 2D</title>
    <link rel="stylesheet" href="../Css/57-Css-Transform(2D).css">
</head>
<body>

    <!--
    CSS TRANSFORM 2D

    1. transform: none
    2. translate()
    3. translateX()
    4. translateY()
    5. rotate()
    6. scale()
    7. scaleX()
    8. scaleY()
    9. skew()
    10. skewX()
    11. skewY()
    12. matrix()

    OTHER PROPERTY

    13. transform-origin
    -->

    <h1>CSS Transform 2D</h1>

    <div class="container">

        <div class="card">
            <h2>None</h2>
            <div class="box none">BOX</div>
        </div>

        <div class="card">
            <h2>Translate</h2>
            <div class="box translate">BOX</div>
        </div>

        <div class="card">
            <h2>Translate X</h2>
            <div class="box translate-x">BOX</div>
        </div>

        <div class="card">
            <h2>Translate Y</h2>
            <div class="box translate-y">BOX</div>
        </div>

        <div class="card">
            <h2>Rotate</h2>
            <div class="box rotate">BOX</div>
        </div>

        <div class="card">
            <h2>Scale</h2>
            <div class="box scale">BOX</div>
        </div>

        <div class="card">
            <h2>Scale X</h2>
            <div class="box scale-x">BOX</div>
        </div>

        <div class="card">
            <h2>Scale Y</h2>
            <div class="box scale-y">BOX</div>
        </div>

        <div class="card">
            <h2>Skew</h2>
            <div class="box skew">BOX</div>
        </div>

        <div class="card">
            <h2>Skew X</h2>
            <div class="box skew-x">BOX</div>
        </div>

        <div class="card">
            <h2>Skew Y</h2>
            <div class="box skew-y">BOX</div>
        </div>

        <div class="card">
            <h2>Matrix</h2>
            <div class="box matrix">BOX</div>
        </div>

        <div class="card">
            <h2>Transform Origin</h2>
            <div class="box origin">BOX</div>
        </div>

        <div class="card">
            <h2>Multiple Transform</h2>
            <div class="box multiple">BOX</div>
        </div>

    </div>

</body>
</html>
