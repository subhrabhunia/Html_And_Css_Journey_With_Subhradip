<!-- In this file we know about CSS visibility property. -->

<!-- CSS VISIBILITY VALUES:-

1. visible
2. hidden
3. collapse

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Visibility</title>
    <link rel="stylesheet" href="../Css/41-Css-Visibility.css">
</head>
<body>

    <h1>CSS VISIBILITY</h1>

    <h2>1. visibility: visible;</h2>

    <div class="box visible">
        This box is visible.
    </div>


    <h2>2. visibility: hidden;</h2>

    <div class="box hidden">
        This box is hidden, but space remains.
    </div>


    <h2>3. visibility: collapse;</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>BCA</td>
            <td>20</td>
        </tr>

        <tr class="collapse-row">
            <td>Subhradip</td>
            <td>BCA</td>
            <td>21</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>BCA</td>
            <td>22</td>
        </tr>
    </table>

</body>
</html>
