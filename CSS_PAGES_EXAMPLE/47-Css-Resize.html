<!-- In this file we know about CSS resize property. -->

<!-- CSS RESIZE VALUES:-

1. none
2. both
3. horizontal
4. vertical

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Resize</title>
    <link rel="stylesheet" href="../Css/47-CSS-Resize.css">
</head>
<body>

    <h1>CSS RESIZE</h1>

    <h2>1. resize: none;</h2>

    <div class="box none">
        This box cannot be resized.
    </div>


    <h2>2. resize: both;</h2>

    <div class="box both">
        Resize this box horizontally and vertically.
    </div>


    <h2>3. resize: horizontal;</h2>

    <div class="box horizontal">
        Resize this box horizontally.
    </div>


    <h2>4. resize: vertical;</h2>

    <div class="box vertical">
        Resize this box vertically.
    </div>


    <h2>Resize with Textarea</h2>

    <textarea class="textarea-both" placeholder="Resize this textarea"></textarea>

    <textarea class="textarea-horizontal" placeholder="Resize horizontally"></textarea>

    <textarea class="textarea-vertical" placeholder="Resize vertically"></textarea>

</body>
</html>
