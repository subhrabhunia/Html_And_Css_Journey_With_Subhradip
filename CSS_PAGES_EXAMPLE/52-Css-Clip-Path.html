<!-- In this file we know about CSS clip-path property. -->
<!-- https://caniuse.com/   This website use to check which property working which search engine -->
<!-- CSS CLIP-PATH VALUES:-

1. none
2. circle()
3. ellipse()
4. inset()
5. polygon()
6. path()

COMMON SHAPES:-

7. Triangle
8. Diamond
9. Pentagon
10. Hexagon
11. Trapezoid
12. Parallelogram
13. Circle
14. Ellipse
15. Slanted Box

SYNTAX:-

clip-path: none;

clip-path: circle();

clip-path: ellipse();

clip-path: inset();

clip-path: polygon();


We use website where we get the all shape clip path Name is https://clippy.f8.edu.vn/

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Clip Path</title>

    <link rel="stylesheet" href="../Css/52-CSS-Clip-Path.css">

</head>

<body>

    <h1>CSS CLIP-PATH</h1>

    <div class="container">

        <div class="box none">
            <h2>None</h2>
            <p>clip-path: none</p>
        </div>

        <div class="box circle">
            <h2>Circle</h2>
            <p>circle()</p>
        </div>

        <div class="box ellipse">
            <h2>Ellipse</h2>
            <p>ellipse()</p>
        </div>

        <div class="box inset">
            <h2>Inset</h2>
            <p>inset()</p>
        </div>

        <div class="box triangle">
            <h2>Triangle</h2>
            <p>polygon()</p>
        </div>

        <div class="box diamond">
            <h2>Diamond</h2>
            <p>polygon()</p>
        </div>

        <div class="box pentagon">
            <h2>Pentagon</h2>
            <p>polygon()</p>
        </div>

        <div class="box hexagon">
            <h2>Hexagon</h2>
            <p>polygon()</p>
        </div>

        <div class="box trapezoid">
            <h2>Trapezoid</h2>
            <p>polygon()</p>
        </div>

        <div class="box parallelogram">
            <h2>Parallelogram</h2>
            <p>polygon()</p>
        </div>

        <div class="box slanted">
            <h2>Slanted</h2>
            <p>polygon()</p>
        </div>

    </div>

</body>

</html>
