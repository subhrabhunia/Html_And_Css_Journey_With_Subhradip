<!-- In this file we know about background-clip property. -->

<!-- CSS BACKGROUND-CLIP VALUES:-

1. border-box
2. padding-box
3. content-box
4. text

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Background Clip</title>

    <link rel="stylesheet" href="../Css/34-Background-Clip.css">

</head>

<body>

    <h1>CSS BACKGROUND-CLIP</h1>


    <!-- ==================== BORDER-BOX ==================== -->

    <h2>BACKGROUND-CLIP: BORDER-BOX</h2>

    <div class="One">

        <p>
            background-clip: border-box;
        </p>

    </div>


    <!-- ==================== PADDING-BOX ==================== -->

    <h2>BACKGROUND-CLIP: PADDING-BOX</h2>

    <div class="two">

        <p>
            background-clip: padding-box;
        </p>

    </div>


    <!-- ==================== CONTENT-BOX ==================== -->

    <h2>BACKGROUND-CLIP: CONTENT-BOX</h2>

    <div class="three">

        <p>
            background-clip: content-box;
        </p>

    </div>


    <!-- ==================== TEXT ==================== -->

    <h2>BACKGROUND-CLIP: TEXT</h2>

    <div class="four">

        <h1>
            BACKGROUND TEXT
        </h1>

        <p>
            background-clip: text;
        </p>

    </div>

</body>

</html>
