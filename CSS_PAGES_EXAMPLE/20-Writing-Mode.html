<!-- In this file we know about writing-mode property. -->

<!-- CSS WRITING-MODE VALUES:-

1. horizontal-tb
2. vertical-rl
3. vertical-lr
4. sideways-rl
5. sideways-lr

CSS writing-mode controls whether text is written horizontally or vertically.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Writing Mode</title>

    <!-- Link with CSS File -->
    <link rel="stylesheet" href="../Css/20-Writing-Mode.css">

</head>

<body>

    <!-- ==================== WRITING-MODE ==================== -->

    <h2>WRITING-MODE</h2>


    <!-- Horizontal Top to Bottom -->

    <div class="One">

        <p>
            Writing Mode: Horizontal TB
        </p>

    </div>

    <br>


    <!-- Vertical Right to Left -->

    <div class="two">

        <p>
            Writing Mode: Vertical RL
        </p>

    </div>

    <br>


    <!-- Vertical Left to Right -->

    <div class="three">

        <p>
            Writing Mode: Vertical LR
        </p>

    </div>

    <br>


    <!-- Sideways Right to Left -->

    <div class="four">

        <p>
            Writing Mode: Sideways RL
        </p>

    </div>

    <br>


    <!-- Sideways Left to Right -->

    <div class="five">

        <p>
            Writing Mode: Sideways LR
        </p>

    </div>

</body>

</html>
