<!-- In this file we know about text-box-trim and text-box-edge. -->

<!-- CSS TEXT-BOX PROPERTIES:-

1. text-box-trim
2. text-box-edge

TEXT-BOX-TRIM VALUES:-

1. none
2. trim-start
3. trim-end
4. trim-both

TEXT-BOX-EDGE VALUES:-

1. auto
2. text
3. cap
4. ex
5. ideographic
6. text

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Text Box Trim</title>

    <!-- Link with CSS File -->
    <link rel="stylesheet" href="../Css/24-Text-Box-Trim.css">

</head>

<body>

    <!-- ==================== TEXT-BOX-TRIM ==================== -->

    <h2>TEXT-BOX-TRIM & TEXT-BOX-EDGE</h2>


    <!-- Trim None -->

    <div class="One">

        <h1>Text Box Trim: None</h1>

    </div>

    <br>


    <!-- Trim Start -->

    <div class="two">

        <h1>Text Box Trim: Start</h1>

    </div>

    <br>


    <!-- Trim End -->

    <div class="three">

        <h1>Text Box Trim: End</h1>

    </div>

    <br>


    <!-- Trim Both -->

    <div class="four">

        <h1>Text Box Trim: Both</h1>

    </div>

    <br>


    <!-- Text Box Edge -->

    <div class="five">

        <h1>Text Box Edge: Text</h1>

    </div>

    <br>


    <!-- Text Box Edge Cap -->

    <div class="six">

        <h1>Text Box Edge: Cap</h1>

    </div>

</body>

</html>
