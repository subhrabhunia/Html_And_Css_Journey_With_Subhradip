<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform 3D</title>
    <link rel="stylesheet" href="../Css/58-CSS-Transform-3D.css">
</head>
<body>

    <!--
    CSS TRANSFORM 3D

    1. translate3d()
    2. translateX()
    3. translateY()
    4. translateZ()
    5. rotateX()
    6. rotateY()
    7. rotateZ()
    8. scale3d()
    9. scaleZ()
    10. perspective()
    11. matrix3d()

    3D PROPERTIES

    12. perspective
    13. perspective-origin
    14. transform-style
    15. backface-visibility
    16. transform-origin
    -->

    <h1>CSS Transform 3D</h1>

    <div class="container">

        <div class="card">
            <h2>Translate 3D</h2>
            <div class="scene">
                <div class="box translate3d">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Translate Z</h2>
            <div class="scene">
                <div class="box translate-z">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Rotate X</h2>
            <div class="scene">
                <div class="box rotate-x">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Rotate Y</h2>
            <div class="scene">
                <div class="box rotate-y">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Rotate Z</h2>
            <div class="scene">
                <div class="box rotate-z">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Scale 3D</h2>
            <div class="scene">
                <div class="box scale3d">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Scale Z</h2>
            <div class="scene">
                <div class="box scale-z">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Perspective</h2>
            <div class="scene perspective">
                <div class="box perspective-box">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Matrix 3D</h2>
            <div class="scene">
                <div class="box matrix3d">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Multiple 3D</h2>
            <div class="scene">
                <div class="box multiple">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Transform Style</h2>
            <div class="scene preserve">
                <div class="box style-box">BOX</div>
            </div>
        </div>

        <div class="card">
            <h2>Backface Visibility</h2>
            <div class="scene">
                <div class="box backface">BOX</div>
            </div>
        </div>

    </div>


    <section class="cube-section">

        <h1>3D Cube</h1>

        <div class="cube-scene">

            <div class="cube">

                <div class="face front">FRONT</div>
                <div class="face back">BACK</div>
                <div class="face right">RIGHT</div>
                <div class="face left">LEFT</div>
                <div class="face top">TOP</div>
                <div class="face bottom">BOTTOM</div>

            </div>

        </div>

    </section>

</body>
</html>
