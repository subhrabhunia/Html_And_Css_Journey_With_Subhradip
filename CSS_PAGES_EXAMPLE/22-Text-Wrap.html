<!-- In this file we know about text-wrap property. -->

<!-- CSS TEXT-WRAP:-

1. wrap
2. nowrap
3. balance

-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Text Wrap</title>

    <!-- Link with CSS File -->
    <link rel="stylesheet" href="../Css/22-Text-Wrap.css">

</head>

<body>

    <!-- ==================== TEXT-WRAP ==================== -->

    <h2>TEXT-WRAP</h2>


    <!-- Text Wrap: Wrap -->

    <div class="One">

        <p>
            Text Wrap: Wrap. This is a long paragraph
            that will wrap normally into multiple lines.
        </p>

    </div>

    <br>


    <!-- Text Wrap: No Wrap -->

    <div class="two">

        <p>
            Text Wrap: No Wrap. This is a long text
            that will try to stay on one line.
        </p>

    </div>

    <br>


    <!-- Text Wrap: Balance -->

    <div class="three">

        <h3>
            Text Wrap: Balance. This heading will try
            to distribute its words evenly across lines.
        </h3>

    </div>

    <br>


    <!-- Text Wrap: Balance Example -->

    <div class="four">

        <h2>
            CSS Text Wrap Balance Example
        </h2>

    </div>

</body>

</html>
