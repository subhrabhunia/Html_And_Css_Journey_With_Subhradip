<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Caret Color</title>

    <link rel="stylesheet" href="../Css/74-CSS-Caret-Color.css">
</head>

<body>

    <!--
    CSS CARET COLOR

    1. caret-color
    2. caret-color: auto
    3. caret-color: transparent
    4. caret-color: red
    5. caret-color: blue
    6. caret-color: green
    7. caret-color: purple
    8. caret-color: orange
    9. caret-color: currentColor
    10. caret-color: initial
    11. caret-color: inherit
    12. caret-color: unset
    13. caret-color: revert
    14. caret-color: revert-layer

    APPLIES TO

    1. input
    2. textarea
    3. contenteditable elements
    -->


    <h1>CSS Caret Color</h1>


    <div class="container">


        <!-- 1. Default -->

        <section class="card">

            <h2>1. Default Caret</h2>

            <input
                type="text"
                class="default-caret"
                placeholder="Click and type here">

        </section>


        <!-- 2. Red -->

        <section class="card">

            <h2>2. Red Caret</h2>

            <input
                type="text"
                class="red-caret"
                placeholder="Red caret">

        </section>


        <!-- 3. Blue -->

        <section class="card">

            <h2>3. Blue Caret</h2>

            <input
                type="text"
                class="blue-caret"
                placeholder="Blue caret">

        </section>


        <!-- 4. Green -->

        <section class="card">

            <h2>4. Green Caret</h2>

            <input
                type="text"
                class="green-caret"
                placeholder="Green caret">

        </section>


        <!-- 5. Purple -->

        <section class="card">

            <h2>5. Purple Caret</h2>

            <input
                type="text"
                class="purple-caret"
                placeholder="Purple caret">

        </section>


        <!-- 6. Orange -->

        <section class="card">

            <h2>6. Orange Caret</h2>

            <input
                type="text"
                class="orange-caret"
                placeholder="Orange caret">

        </section>


        <!-- 7. Transparent -->

        <section class="card">

            <h2>7. Transparent Caret</h2>

            <input
                type="text"
                class="transparent-caret"
                placeholder="Caret is invisible">

        </section>


        <!-- 8. Current Color -->

        <section class="card">

            <h2>8. currentColor</h2>

            <input
                type="text"
                class="current-caret"
                placeholder="Caret follows text color">

        </section>


        <!-- 9. Textarea -->

        <section class="card">

            <h2>9. Textarea</h2>

            <textarea
                class="textarea-caret"
                placeholder="Write something here..."></textarea>

        </section>


        <!-- 10. Contenteditable -->

        <section class="card">

            <h2>10. Contenteditable</h2>

            <div
                class="editable-caret"
                contenteditable="true">

                Click here and type something...

            </div>

        </section>


        <!-- 11. Initial -->

        <section class="card">

            <h2>11. initial</h2>

            <input
                type="text"
                class="initial-caret"
                placeholder="Initial caret">

        </section>


        <!-- 12. Inherit -->

        <section class="card inherit-parent">

            <h2>12. inherit</h2>

            <input
                type="text"
                class="inherit-caret"
                placeholder="Inherited caret">

        </section>


    </div>


    <!-- =====================================================
         PRACTICAL FORM
         ===================================================== -->


    <section class="form-demo">

        <h2>Practical Form Example</h2>

        <form>

            <label>
                Name
            </label>

            <input
                type="text"
                placeholder="Enter your name">


            <label>
                Email
            </label>

            <input
                type="email"
                placeholder="Enter your email">


            <label>
                Message
            </label>

            <textarea
                placeholder="Write your message"></textarea>


            <button type="submit">
                Submit
            </button>

        </form>

    </section>


</body>

</html>
