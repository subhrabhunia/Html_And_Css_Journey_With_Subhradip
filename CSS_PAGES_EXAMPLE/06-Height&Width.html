<!-- In this file we know about height and width property. -->

<!-- CSS HEIGHT AND WIDTH PROPERTIES:-

1. Height
2. Width
3. Min-Height
4. Max-Height
5. Min-Width
6. Max-Width

-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Height and Width</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/06-Height&Width.css" />
  </head>

  <body>
    <!-- Height -->
    <div class="One">
      <p>Height : 100px</p>
    </div>

    <br />

    <!-- Width -->
    <div class="two">
      <p>Width : 500px</p>
    </div>

    <br />

    <!-- Height and Width -->
    <div class="three">
      <p>Height : 150px | Width : 500px</p>
    </div>

    <br />

    <!-- Min Height -->
    <div class="four">
      <p>Min Height : 100px</p>
    </div>

    <br />

    <!-- Max Height -->
    <div class="five">
      <p>Max Height : 200px</p>
    </div>

    <br />

    <!-- Min Width -->
    <div class="six">
      <p>Min Width : 300px</p>
    </div>

    <br />

    <!-- Max Width -->
    <div class="seven">
      <p>Max Width : 600px</p>
    </div>
    <br />

    <div class="eight">
      <p>Width : 50%</p>
    </div>
  </body>
</html>
