<!-- In this file we know about box-sizing property. -->
<!-- The main use of box-sizing is to control how the total width and height of an element are calculated. -->
<!-- CSS BOX-SIZING PROPERTY:-

1. box-sizing: content-box;
2. box-sizing: border-box;

-->
<!-- 
content-box
    ↓
Width + Padding + Border
    ↓
Total Size becomes bigger


border-box
    ↓
Width includes Padding + Border
    ↓
Total Size remains fixed -->



<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Sizing</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/07-Box-Sizing.css">

</head>

<body>

    <!-- Content Box -->

    <div class="One">

        <p>Box Sizing : Content Box</p>

    </div>

    <br>

    <!-- Border Box -->

    <div class="two">

        <p>Box Sizing : Border Box ` </p>

    </div>

</body>
</html>
