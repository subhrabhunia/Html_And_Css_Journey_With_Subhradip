<!-- In this file we know about border-radius property. -->

<!-- CSS BORDER-RADIUS PROPERTIES:-

1. border-radius
2. border-top-left-radius
3. border-top-right-radius
4. border-bottom-right-radius
5. border-bottom-left-radius

BORDER-RADIUS SHORTHAND:-

1. border-radius: 20px;
2. border-radius: 10px 20px;
3. border-radius: 10px 20px 30px;
4. border-radius: 10px 20px 30px 40px;
        10px
         ↓
   ┌───────────┐
40px           20px
   └───────────┘
         ↑
        30px

Top-Left → Top-Right → Bottom-Right → Bottom-Left
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Border Radius</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="../Css/09-Border-Radius.css">

</head>

<body>

    <!-- Border Radius: One Value -->

    <div class="One">
        <p>Border Radius : 20px</p>
    </div>

    <br>

    <!-- Border Radius: Two Values -->

    <div class="two">
        <p>Border Radius : 10px 20px</p>
    </div>

    <br>

    <!-- Border Radius: Three Values -->

    <div class="three">
        <p>Border Radius : 10px 20px 30px</p>
    </div>

    <br>

    <!-- Border Radius: Four Values -->

    <div class="four">
        <p>Border Radius : 10px 20px 30px 40px</p>
    </div>

    <br>

    <!-- Border Radius: 50% -->

    <div class="five">
        <p>Border Radius : 50%</p>
    </div>

    <br>

    <!-- Top Left -->

    <div class="six">
        <p>Top Left Radius</p>
    </div>

    <br>

    <!-- Top Right -->

    <div class="seven">
        <p>Top Right Radius</p>
    </div>

    <br>

    <!-- Bottom Right -->

    <div class="eight">
        <p>Bottom Right Radius</p>
    </div>

    <br>

    <!-- Bottom Left -->

    <div class="nine">
        <p>Bottom Left Radius</p>
    </div>

</body>
</html>
